<style>
:root{
  --blue:#E00000;
  --blue-dark:#1E2023;
  --blue-2:#F2F0EA;
  --surface:#FFFFFF;
  --ink:#1D2733;
  --ink-soft:#5B6572;
  --amber:#F5A623;
  --red:#D64545;
  --orange:#E07B39;
  --green:#2F9E6E;
  --line:#DCE3EA;
  --radius:6px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ font-family:'Inter',sans-serif; background:var(--blue-2); color:var(--ink); min-height:100vh; }
h1,h2,h3,.display{ font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:0.01em; }
.mono{ font-family:'JetBrains Mono',monospace; }

.blueprint-strip{
  height:6px;
  background:repeating-linear-gradient(90deg, var(--blue) 0 18px, var(--amber) 18px 22px);
}

.app{display:flex; min-height:100vh;}
.sidebar{ width:220px; background:var(--blue-dark); color:#E7EEF4; flex-shrink:0; display:flex; flex-direction:column; }
.brand{ padding:22px 20px 16px; border-bottom:1px solid #1F435F; }
.brand .display{ font-size:24px; color:#fff; line-height:1.05; }
.brand .sub{ font-size:11px; color:#9FB4C6; letter-spacing:0.06em; margin-top:3px; text-transform:uppercase; }
nav{ padding:14px 10px; flex:1; }
nav button{ display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; color:#C7D5E0; text-align:left;
  padding:11px 12px; border-radius:var(--radius); font-size:14px; font-weight:500; cursor:pointer; margin-bottom:2px; }
nav button:hover{ background:#1B415C; }

async function apiFetch(path, options={}){
  const token = localStorage.getItem('vst_session');
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if(token) headers['Authorization'] = 'Bearer ' + token;
  try{
    const res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
    const data = await res.json().catch(() => null);
    return { ok: res.ok, status: res.status, data };
  }catch(e){
    return { ok: false, status: 0, data: { message: e.message } };
  }
}

function comprimirImagem(file, maxDim=1600, qualidade=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim && h > w){ w = Math.round(w*maxDim/h); h = maxDim; }
        else if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = () => reject(new Error('Não foi possível ler a imagem'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('Não foi possível ler o arquivo'));
    reader.readAsDataURL(file);
  });
}

async function processarFotoSelecionada(file){
  if(!file) return;
  try{
    const dataUrl = await comprimirImagem(file);
    imagemAtual = dataUrl.split(',')[1];

    const img = document.getElementById('preview-img');

    document.getElementById('btn-analisar').disabled = false;

    toast('Erro ao processar a imagem', false);
    console.error(e);
  }
}

async function salvarDiagnostico(){
  const titulo = document.getElementById('novo-titulo').value;
  const local = document.getElementById('novo-local').value;
  const endereco = document.getElementById('novo-endereco').value;
  const obs = document.getElementById('novo-obs')?.value || '';
  const r = resultadoIA;

  const payload = {
    titulo, obra_local: local, endereco,
    imagem_base64: imagemAtual,
    patologia_tipo: r.manifestacao_tipo,
    gravidade: r.classificacao_risco,
    provavel_estrutural: labelElementoEstrutural(r.elemento_estrutural),
    norma_referencia: r.norma_referencia,
    diagnostico_texto: r.caracteristicas_visuais || r.diagnostico_hipotese_principal || '',
    recomendacao: r.diagnostico_medidas || '',
    observacoes: obs,
    status: 'aberto',
    analise_json: JSON.stringify(r)
  };

  const resp = await apiFetch('/api/diagnosticos', { method:'POST', body: JSON.stringify(payload) });
  if(!resp.ok){ toast(resp.data?.message || 'Erro ao salvar', false); return; }
  toast('Diagnóstico salvo com sucesso');
  document.querySelector('[data-view="historico"]').click();
}

function adicionarAmbiente(nome){
  vistoriaAtual.ambientes.push({ nome, itens: [] });
  renderListaAmbientes();
}
function adicionarAmbienteCustom(){
  const input = document.getElementById('vc-ambiente-custom');
  if(!input.value.trim()) return;
  adicionarAmbiente(input.value.trim());
  input.value = '';
}
function removerAmbiente(idx){
  if(!confirm('Remover este ambiente e todos os itens dele?')) return;
  vistoriaAtual.ambientes.splice(idx,1);
  renderListaAmbientes();
}

function renderListaAmbientes(){
  const box = document.getElementById('lista-ambientes');
  document.querySelector('#content .panel:nth-child(2) h2 .tag') && (document.querySelector('#content .panel:nth-child(2) h2 .tag').textContent = `${vistoriaAtual.ambientes.length} adicionado(s)`);

      <div class="row2" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">

function adicionarItem(aIdx, nomeItem){
  vistoriaAtual.ambientes[aIdx].itens.push({ item: nomeItem, estado: 'bom', observacao: '', imagem_base64: null });
  document.getElementById(`itens-ambiente-${aIdx}`).innerHTML = renderItensAmbiente(vistoriaAtual.ambientes[aIdx], aIdx);
}
function removerItem(aIdx, iIdx){
  vistoriaAtual.ambientes[aIdx].itens.splice(iIdx,1);
  document.getElementById(`itens-ambiente-${aIdx}`).innerHTML = renderItensAmbiente(vistoriaAtual.ambientes[aIdx], aIdx);
}

function renderItensAmbiente(amb, aIdx){
  if(!amb.itens.length) return '<div style="font-size:12.5px; color:var(--ink-soft);">Nenhum item ainda — clique nos botões acima.</div>';
  return amb.itens.map((it, iIdx) => `

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="font-size:13.5px;">${it.item}</strong>
        <button type="button" class="btn btn-danger btn-sm" onclick="removerItem(${aIdx},${iIdx})">Remover</button>
      </div>
      <div class="row">
        <div class="field" style="margin-bottom:8px;"><label>Estado</label>
          <select onchange="atualizarItem(${aIdx},${iIdx},'estado',this.value)">
            <option value="bom" ${it.estado==='bom'?'selected':''}>Bom</option>
            <option value="regular" ${it.estado==='regular'?'selected':''}>Regular</option>
            <option value="ruim" ${it.estado==='ruim'?'selected':''}>Ruim</option>
            <option value="nao_aplicavel" ${it.estado==='nao_aplicavel'?'selected':''}>Não aplicável</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:8px;"><label>Foto</label>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn btn-outline btn-sm" onclick="abrirFotoItem(${aIdx},${iIdx},'camera')">📷 Foto</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="abrirFotoItem(${aIdx},${iIdx},'galeria')">🖼 Galeria</button>
          </div>
        </div>
      </div>
      ${it.imagem_base64 ? `<img src="data:image/jpeg;base64,${it.imagem_base64}" style="max-width:120px; border-radius:4px; margin-bottom:8px; display:block;">` : ''}
      <input placeholder="Observação (opcional)" value="${it.observacao||''}" onchange="atualizarItem(${aIdx},${iIdx},'observacao',this.value)">
    </div>
  `).join('');
}

function atualizarItem(aIdx, iIdx, campo, valor){
  vistoriaAtual.ambientes[aIdx].itens[iIdx][campo] = valor;
}

function abrirFotoItem(aIdx, iIdx, origem){
  itemFotoAlvo = { aIdx, iIdx };
  document.getElementById(origem === 'camera' ? 'vc-input-camera' : 'vc-input-galeria').click();
}

async function fotoItemSelecionada(file){
  if(!file || !itemFotoAlvo) return;
  await fotoItem(itemFotoAlvo.aIdx, itemFotoAlvo.iIdx, file);
  itemFotoAlvo = null;
}

async function fotoItem(aIdx, iIdx, file){
  if(!file) return;
  try{
    const dataUrl = await comprimirImagem(file, 1000, 0.65);
    vistoriaAtual.ambientes[aIdx].itens[iIdx].imagem_base64 = dataUrl.split(',')[1];
    document.getElementById(`itens-ambiente-${aIdx}`).innerHTML = renderItensAmbiente(vistoriaAtual.ambientes[aIdx], aIdx);
  }catch(e){ toast('Erro ao processar a foto', false); }
}

async function salvarVistoriaCompleta(){
  if(!vistoriaAtual.categoria){ toast('Selecione a categoria da vistoria', false); return; }
  if(!vistoriaAtual.titulo){ toast('Preencha o título da vistoria', false); return; }
  if(!vistoriaAtual.ambientes.length){ toast('Adicione ao menos um ambiente', false); return; }

  const obsGerais = document.getElementById('vc-obs-gerais').value;
  const payload = {
    categoria: vistoriaAtual.categoria,
    titulo: vistoriaAtual.titulo,
    imovel_endereco: vistoriaAtual.imovel_endereco,
    cliente_nome: vistoriaAtual.cliente_nome,
    data_vistoria: vistoriaAtual.data_vistoria,
    observacoes_gerais: obsGerais,
    conteudo_json: JSON.stringify({ ambientes: vistoriaAtual.ambientes }),
    status: 'concluida'
  };

  const resp = await apiFetch('/api/vistorias', { method:'POST', body: JSON.stringify(payload) });
  if(!resp.ok){ toast(resp.data?.message || 'Erro ao salvar vistoria', false); return; }
  toast('Vistoria salva com sucesso');
  document.querySelector('[data-view="historico"]').click();
}

function labelCategoria(c){
  const found = CATEGORIAS_VISTORIA.find(x=>x.v===c);
  return found ? found.l : (c || '-');
}

function tabelaVistorias(list){
  const tabela = `<div class="table-scroll"><table><thead><tr><th>Data</th><th>Título</th><th>Categoria</th><th>Endereço</th><th></th></tr></thead><tbody>
    ${list.map(v=>`<tr>
      <td class="mono">${fmtDate(v.data_vistoria || v.criado_em)}</td>
      <td>${v.titulo || '-'}</td>
      <td>${labelCategoria(v.categoria)}</td>
      <td>${v.imovel_endereco || '-'}</td>
      <td><button class="btn btn-outline btn-sm" onclick="verVistoria('${v.id}')">Ver</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;

  const cards = `<div class="diag-cards">
    ${list.map(v=>`<div class="diag-card" onclick="verVistoria('${v.id}')">
      <div class="row2"><span class="title">${v.titulo || 'Sem título'}</span></div>
      <div class="meta">${labelCategoria(v.categoria)}</div>
      <div class="meta">${v.imovel_endereco || '-'} · ${fmtDate(v.data_vistoria || v.criado_em)}</div>
    </div>`).join('')}
  </div>`;

  return tabela + cards;
}

function filtrarVistorias(){
  const termo = document.getElementById('busca-vist').value.toLowerCase();
  const filtrados = DB.vistorias.filter(v =>
    (v.titulo||'').toLowerCase().includes(termo) ||
    (v.imovel_endereco||'').toLowerCase().includes(termo) ||
    (v.cliente_nome||'').toLowerCase().includes(termo)
  );
  document.getElementById('lista-vist').innerHTML = filtrados.length ? tabelaVistorias(filtrados) : `<div class="empty"><div class="display">Nenhum resultado encontrado</div></div>`;
}

async function verVistoria(id){
  const resp = await apiFetch(`/api/vistorias/${id}`);
  if(!resp.ok){ toast('Erro ao carregar vistoria', false); return; }
  const v = resp.data;
  const conteudo = JSON.parse(v.conteudo_json || '{"ambientes":[]}');
  window._vistAtual = v;
  window._vistConteudo = conteudo;

  const badgeEstado = (e) => {
    const map = {bom:'badge-baixa', regular:'badge-media', ruim:'badge-alta', nao_aplicavel:'badge-indeterminado'};
    const lab = {bom:'Bom', regular:'Regular', ruim:'Ruim', nao_aplicavel:'N/A'};
    return `<span class="badge ${map[e]||'badge-indeterminado'}">${lab[e]||e}</span>`;
  };

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <h2>${v.titulo || 'Vistoria'} <span class="tag">${labelCategoria(v.categoria)}</span></h2>
      <div class="row">
        <div><strong>Endereço:</strong> ${v.imovel_endereco || '-'}</div>
        <div><strong>Cliente:</strong> ${v.cliente_nome || '-'}</div>
      </div>
      <div style="font-size:13.5px; margin-top:6px;"><strong>Data:</strong> ${fmtDate(v.data_vistoria)}</div>

      ${conteudo.ambientes.map(amb => {
        const itensSimples = amb.itens.filter(it => !it.imagem_base64 && !it.observacao);
        const itensDetalhados = amb.itens.filter(it => it.imagem_base64 || it.observacao);
        return `
        <div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--line);">
          <h3 style="font-size:15.5px; margin-bottom:8px;">${amb.nome}</h3>
          ${itensSimples.length ? `
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:4px 16px; margin-bottom:${itensDetalhados.length ? '10px' : '0'};">
              ${itensSimples.map(it => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:13px;">
                  <span>${it.item}</span> ${badgeEstado(it.estado)}
                </div>
              `).join('')}
            </div>
          ` : ''}
          ${itensDetalhados.map(it => `
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:6px 0; font-size:13.5px; border-top:1px dashed var(--line);">
              <div>
                <strong>${it.item}</strong> ${badgeEstado(it.estado)}
                ${it.observacao ? `<div style="color:var(--ink-soft); font-size:12.5px;">${it.observacao}</div>` : ''}
              </div>
              ${it.imagem_base64 ? `<img src="data:image/jpeg;base64,${it.imagem_base64}" style="width:60px; height:60px; object-fit:cover; border-radius:4px; flex-shrink:0;">` : ''}
            </div>
          `).join('')}
        </div>
      `;}).join('')}

      ${v.observacoes_gerais ? `<div style="margin-top:14px; font-size:13.5px;"><strong>Observações gerais:</strong> ${v.observacoes_gerais}</div>` : ''}

      <div style="margin-top:18px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="gerarLaudoPDF()">Gerar laudo PDF</button>
        <button class="btn btn-danger btn-sm" onclick="excluirVistoria('${v.id}')">Excluir</button>
        <button class="btn btn-outline btn-sm" onclick="document.querySelector('[data-view=&quot;historico&quot;]').click()">Voltar</button>
      </div>
    </div>
  `;
}

async function excluirVistoria(id){
  if(!confirm('Excluir esta vistoria? Essa ação não pode ser desfeita.')) return;
  const resp = await apiFetch(`/api/vistorias/${id}`, { method:'DELETE' });

function gerarLaudoPDF(){
  const v = window._vistAtual;
  const conteudo = window._vistConteudo;
  if(!v || !conteudo) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const labEstado = {bom:'Bom', regular:'Regular', ruim:'Ruim', nao_aplicavel:'Não aplicável'};

  function novaPagina(){
    doc.addPage();
    return desenharCabecalhoLaudo();
  }
  function desenharCabecalhoLaudo(){
    doc.setFillColor(224,0,0);
    doc.rect(0,0,210,16,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('VISTORIA — LAUDO DE VISTORIA', 15, 10);
    doc.setTextColor(0,0,0);
    return 26;
  }

  let y = desenharCabecalhoLaudo();
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(v.titulo || 'Vistoria', 15, y); y+=8;

  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Categoria: ${labelCategoria(v.categoria)}`, 15, y); y+=6;
  doc.text(`Endereço: ${v.imovel_endereco || '-'}`, 15, y); y+=6;
  doc.text(`Cliente/Responsável: ${v.cliente_nome || '-'}`, 15, y); y+=6;
  doc.text(`Data da vistoria: ${fmtDate(v.data_vistoria)}`, 15, y); y+=6;
  doc.text(`Vistoriador: ${v.usuario_email || '-'}`, 15, y); y+=10;

  conteudo.ambientes.forEach(amb=>{
    if(y > 250){ y = novaPagina(); }
    doc.setFillColor(240,244,248);
    doc.rect(15, y-4, 180, 8, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(amb.nome, 17, y+1.5); y+=10;

    const itensSimples = amb.itens.filter(it => !it.imagem_base64 && !it.observacao);
    const itensDetalhados = amb.itens.filter(it => it.imagem_base64 || it.observacao);

    // itens sem foto/observação: layout em 2 colunas, compacto
    for(let i=0; i<itensSimples.length; i+=2){
      if(y > 270){ y = novaPagina(); }
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const it1 = itensSimples[i];
      doc.text(`•  ${it1.item} — ${labEstado[it1.estado] || it1.estado}`, 17, y);
      const it2 = itensSimples[i+1];
      if(it2){
        doc.text(`•  ${it2.item} — ${labEstado[it2.estado] || it2.estado}`, 107, y);
      }
      y += 5.5;
    }
    if(itensSimples.length) y += 3;

    // itens com foto ou observação: linha cheia, mais espaço
    itensDetalhados.forEach(it=>{
      if(y > 260){ y = novaPagina(); }
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.text(`${it.item} — ${labEstado[it.estado] || it.estado}`, 17, y);
      if(it.imagem_base64){
        try{ doc.addImage(`data:image/jpeg;base64,${it.imagem_base64}`, 'JPEG', 165, y-4, 28, 21); }catch(e){}
      }
      y += 5;
      if(it.observacao){
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
        const linhasObs = doc.splitTextToSize(it.observacao, 140);
        doc.text(linhasObs, 17, y);
        y += linhasObs.length*4;
      }
      y += (it.imagem_base64 ? 20 : 4);
    });
    y += 4;
  });

  if(v.observacoes_gerais){
    if(y > 240){ y = novaPagina(); }
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Observações gerais:', 15, y); y+=6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    const linhasG = doc.splitTextToSize(v.observacoes_gerais, 180);
    doc.text(linhasG, 15, y); y += linhasG.length*4.5 + 8;
  }

  if(y > 260){ y = novaPagina(); }
  y += 10;
  doc.setFontSize(9);
  doc.text('_______________________________', 15, y);
  doc.text('_______________________________', 115, y); y+=5;
  doc.text('Vistoriador responsável', 15, y);
  doc.text('Cliente / Locatário / Responsável', 115, y);
  y += 14;

  desenharRodapeDesenvolvedor(doc, y);

  doc.save(`vistoria-${(v.titulo||'laudo').replace(/[^a-z0-9]/gi,'-')}.pdf`);
  toast('Laudo PDF gerado');
}

function filtrarDiagnosticos(){
  const termo = document.getElementById('busca-diag').value.toLowerCase();
  const filtrados = DB.diagnosticos.filter(d =>

    (d.obra_local||'').toLowerCase().includes(termo) ||

  );

}

async function verDiagnostico(id){

  const d = resp.data;

  if(d.analise_json){
    try{ analise = JSON.parse(d.analise_json); }catch(e){ analise = null; }
  }

  const blocoAnalise = analise ? renderizarAnaliseIA(analise) : `
      <div class="result-box">
        <div class="row2"><strong>${d.patologia_tipo || '-'}</strong>${badgeGravidade(d.gravidade)}</div>
        <div style="font-size:13.5px; margin-bottom:8px;"><strong>Possível causa estrutural:</strong> ${d.provavel_estrutural || 'indeterminado'}</div>
        ${d.norma_referencia ? `<div style="font-size:12.5px; margin-bottom:8px; color:var(--blue);"><strong>Norma de referência:</strong> ${d.norma_referencia}</div>` : ''}
        <div style="font-size:13.5px; margin-bottom:8px;">${d.diagnostico_texto || ''}</div>
        <div style="font-size:13.5px; color:var(--ink-soft);"><strong>Recomendação:</strong> ${d.recomendacao || ''}</div>
      </div>`;

  const modalHtml = `
    <div class="panel">
      <h2>${d.titulo || 'Diagnóstico'} <span class="tag">${fmtDateTime(d.criado_em)}</span></h2>
      ${d.imagem_base64 ? `<img src="data:image/jpeg;base64,${d.imagem_base64}" style="max-width:100%; max-height:320px; border-radius:6px; margin-bottom:14px;">` : ''}
      <div class="row">
        <div><strong>Obra/Local:</strong> ${d.obra_local || '-'}</div>
        <div><strong>Endereço:</strong> ${d.endereco || '-'}</div>
      </div>
      <div style="margin-top:14px;">${blocoAnalise}</div>
      ${d.observacoes ? `<div style="margin-top:12px; font-size:13.5px;"><strong>Observações:</strong> ${d.observacoes}</div>` : ''}
      <div style="margin-top:16px; display:flex; gap:10px;">
        <button class="btn btn-outline btn-sm" onclick="gerarRelatorioPDF('${d.id}')">Gerar relatório PDF</button>
        <button class="btn btn-danger btn-sm" onclick="excluirDiagnostico('${d.id}')">Excluir</button>
        <button class="btn btn-outline btn-sm" onclick="document.querySelector('[data-view=&quot;historico&quot;]').click()">Voltar</button>
      </div>

function gerarRelatorioPDF(id){
  const d = window._diagAtual;
  if(!d) return;
  let analise = null;
  if(d.analise_json){
    try{ analise = JSON.parse(d.analise_json); }catch(e){ analise = null; }
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  function cabecalho(){
    doc.setFillColor(224,0,0);
    doc.rect(0,0,210,16,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('VISTORIA — AVALIAÇÃO TÉCNICA PRELIMINAR', 15, 10);
    doc.setTextColor(0,0,0);
    return 26;
  }
  function novaPagina(){ doc.addPage(); return cabecalho(); }
  function checarQuebra(yAtual, limite=265){ return yAtual > limite ? novaPagina() : yAtual; }
  function tituloSecao(y, texto){
    y = checarQuebra(y, 260);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(224,0,0);
    doc.text(texto, 15, y); doc.setTextColor(0,0,0);
    return y + 6;
  }
  function paragrafo(y, texto, opts={}){
    if(!texto) return y;
    y = checarQuebra(y);
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal'); doc.setFontSize(opts.size || 9.5);
    const linhas = doc.splitTextToSize(texto, 180);
    doc.text(linhas, 15, y);
    return y + linhas.length * (opts.lh || 4.6) + (opts.gap ?? 4);
  }

  let y = cabecalho();
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(d.titulo || 'Diagnóstico', 15, y); y+=9;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(`Obra/Local: ${d.obra_local || '-'}   ·   Endereço: ${d.endereco || '-'}`, 15, y); y+=5.5;
  doc.text(`Data: ${fmtDateTime(d.criado_em)}   ·   Responsável: ${d.usuario_email || '-'}`, 15, y); y+=9;

  if(d.imagem_base64){
    try{ doc.addImage(`data:image/jpeg;base64,${d.imagem_base64}`, 'JPEG', 15, y, 75, 56); }catch(e){ console.error(e); }
  }

  const labGravidade = {critico:'🔴 CRÍTICO', prioridade:'🟠 PRIORIDADE', atencao:'🟡 ATENÇÃO', baixo:'🟢 BAIXO RISCO', alta:'ALTA', media:'MÉDIA', baixa:'BAIXA'};
  const xInfo = d.imagem_base64 ? 98 : 15;
  let yInfo = d.imagem_base64 ? y : y;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text(`${analise ? (analise.manifestacao_tipo||d.patologia_tipo) : (d.patologia_tipo||'-')}`, xInfo, yInfo); yInfo+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text(`Classificação: ${labGravidade[d.gravidade] || (d.gravidade||'-').toUpperCase()}`, xInfo, yInfo); yInfo+=5.5;
  if(analise?.elemento_afetado){ doc.text(`Elemento: ${analise.elemento_afetado}`, xInfo, yInfo); yInfo+=5.5; }
  if(analise?.local_aparente){ doc.text(`Local: ${analise.local_aparente}`, xInfo, yInfo); yInfo+=5.5; }
  doc.text(`Elemento estrutural: ${d.provavel_estrutural || '-'}`, xInfo, yInfo); yInfo+=5.5;

  y = Math.max(y + (d.imagem_base64 ? 62 : 0), yInfo) + 4;

  if(analise){
    if(analise.caracteristicas_visuais){
      y = tituloSecao(y, '1. CARACTERÍSTICAS OBSERVADAS');
      y = paragrafo(y, analise.caracteristicas_visuais);
    }
    if(analise.extensao_aparente || analise.limitacoes_foto){
      y = paragrafo(y, analise.extensao_aparente ? `Extensão aparente: ${analise.extensao_aparente}` : '', {size:9});
      y = paragrafo(y, analise.limitacoes_foto ? `Limitações da fotografia: ${analise.limitacoes_foto}` : '', {size:8.5});
    }

    if(analise.hipoteses_causa?.length){
      y = tituloSecao(y, '2. HIPÓTESES DE CAUSA');
      analise.hipoteses_causa.forEach(h=>{
        y = paragrafo(y, `• ${h.hipotese}${h.mecanismo ? ' — ' + h.mecanismo : ''}`, {gap:2});
      });
      y += 3;
    }

    y = tituloSecao(y, '3. ELEMENTO ESTRUTURAL/NÃO ESTRUTURAL');
    y = paragrafo(y, `${labelElementoEstrutural(analise.elemento_estrutural)}${analise.elemento_estrutural_motivo ? ' — ' + analise.elemento_estrutural_motivo : ''}`);

    if(analise.investigacoes_recomendadas?.length){
      y = tituloSecao(y, '4. INVESTIGAÇÕES RECOMENDADAS');
      analise.investigacoes_recomendadas.forEach(i=>{ y = paragrafo(y, `• ${i}`, {gap:2}); });
      y += 3;
    }

    if(analise.perguntas_usuario?.length){
      y = tituloSecao(y, '5. PERGUNTAS PARA REFINAR A AVALIAÇÃO');
      analise.perguntas_usuario.forEach(p=>{ y = paragrafo(y, `• ${p}`, {gap:2, size:9}); });
      y += 3;
    }

    y = tituloSecao(y, '6. DIAGNÓSTICO PRELIMINAR');
    y = paragrafo(y, analise.diagnostico_hipotese_principal ? `Hipótese principal: ${analise.diagnostico_hipotese_principal}` : '');
    y = paragrafo(y, analise.diagnostico_medidas ? `Medidas preliminares: ${analise.diagnostico_medidas}` : '');
    if(analise.norma_referencia){ y = paragrafo(y, `Norma de referência: ${analise.norma_referencia}`, {size:9, bold:true}); }
  } else {
    y = tituloSecao(y, 'DESCRIÇÃO TÉCNICA');
    y = paragrafo(y, d.diagnostico_texto || '-');
    y = tituloSecao(y, 'RECOMENDAÇÃO');
    y = paragrafo(y, d.recomendacao || '-');
  }

  if(d.observacoes){
    y = tituloSecao(y, 'OBSERVAÇÕES DO RESPONSÁVEL');
    y = paragrafo(y, d.observacoes);
  }

  y = checarQuebra(y, 250);
  y += 6;
  doc.setFontSize(8); doc.setTextColor(120,120,120);
  const aviso = 'Este relatório é uma avaliação técnica PRELIMINAR assistida por IA, com apoio conceitual em normas ABNT (NBR 16747 e outras aplicáveis). Não é um diagnóstico conclusivo nem substitui a vistoria presencial e o laudo técnico de um engenheiro responsável habilitado.';
  const linhasAviso = doc.splitTextToSize(aviso, 180);
  doc.text(linhasAviso, 15, y);
  y += linhasAviso.length*4 + 8;
  y = checarQuebra(y, 270);
  desenharRodapeDesenvolvedor(doc, y);

  doc.save(`diagnostico-${(d.titulo||'relatorio').replace(/[^a-z0-9]/gi,'-')}.pdf`);
  toast('Relatório PDF gerado');
}

function desenharRodapeDesenvolvedor(doc, y){
  doc.setDrawColor(220,220,220); doc.setLineWidth(0.2);
  doc.line(15, y, 195, y); y+=5;
  doc.setFontSize(7.5); doc.setTextColor(140,140,140);
  doc.text(`Desenvolvido por ${DESENVOLVEDOR.nome} — ${DESENVOLVEDOR.empresa}`, 15, y); y+=4.5;
  doc.text(`${DESENVOLVEDOR.telefone}  ·  ${DESENVOLVEDOR.email}`, 15, y);
  doc.setTextColor(0,0,0);
}

async function renderUsuarios(el){
  if(!supaOk){
    el.innerHTML = `${configNote()}<div class="empty"><div class="display">Indisponível no modo demonstração</div>Configure o backend para gerenciar usuários.</div>`;
    return;
  }

  el.innerHTML = `<div class="empty">Carregando…</div>`;
  const resp = await apiFetch('/api/usuarios');
  if(!resp.ok){
    el.innerHTML = `<div class="empty"><div class="display">Erro ao carregar usuários</div>${resp.data?.message || ''}</div>`;
    return;
  }
  const usuarios = resp.data || [];

  el.innerHTML = `
    <div class="grid grid-2">
      <div class="panel">
        <h2>Novo usuário</h2>
        <div style="font-size:13px; color:var(--ink-soft); margin-bottom:12px;">Cada pessoa que for usar o sistema deve ter seu próprio login.</div>
        <form id="form-usuario">
          <div class="field"><label>E-mail</label><input id="usu-email" type="email" required></div>
          <div class="field"><label>Senha</label><input id="usu-senha" type="password" required minlength="6" placeholder="mínimo 6 caracteres"></div>
          <button type="submit" class="btn btn-primary">Criar usuário</button>
        </form>
      </div>
      <div class="panel">
        <h2>Usuários cadastrados <span class="tag">${usuarios.length}</span></h2>
        <div id="lista-usuarios">${listaUsuariosHTML(usuarios)}</div>
      </div>
    </div>
  `;

  document.getElementById('form-usuario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('usu-email').value;
    const senha = document.getElementById('usu-senha').value;
    const resp2 = await apiFetch('/api/usuarios', { method: 'POST', body: JSON.stringify({ email, password: senha }) });
    if(!resp2.ok){
      toast(resp2.data?.message || 'Erro ao criar usuário', false);
      return;
    }
    toast('Usuário criado com sucesso');
    render('usuarios');
  });
}

function listaUsuariosHTML(usuarios){
  if(!usuarios.length) return `<div class="empty"><div class="display">Nenhum usuário encontrado</div></div>`;
  return `<div class="table-scroll"><table><thead><tr><th>E-mail</th><th>Desde</th><th>Ações</th></tr></thead><tbody>
    ${usuarios.map(u => `<tr>
      <td>${u.email}</td>
      <td class="mono">${fmtDate((u.criado_em||'').slice(0,10))}</td>
      <td>${usuarios.length > 1 ? `<button class="btn btn-danger btn-sm" onclick="excluirUsuario('${u.id}')">Excluir</button>` : '<span class="badge badge-indeterminado">Único</span>'}</td>
    </tr>`).join('')}
    </tbody></table></div>`;
}

async function excluirUsuario(id){
  if(!confirm('Excluir este usuário? Ele não vai mais conseguir entrar no sistema.')) return;
  const resp = await apiFetch(`/api/usuarios/${id}`, { method: 'DELETE' });
  if(!resp.ok){
    toast(resp.data?.message || 'Não foi possível excluir', false);
    return;
  }
  toast('Usuário excluído');
  render('usuarios');
}

/* ======================================================
   AUTENTICAÇÃO
   ====================================================== */
async function initAuth(){
  if(!supaOk){
    document.getElementById('app-shell').classList.remove('hidden');
    render('dashboard');
    return;
  }
  const resp = await apiFetch('/api/me');
  if(resp.ok){
    usuarioLogado = resp.data.email;
    document.getElementById('app-shell').classList.remove('hidden');
    render('dashboard');
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
  }
}

document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';

  const resp = await apiFetch('/api/login', { method:'POST', body: JSON.stringify({ email, password: senha }) });
  if(!resp.ok){
    errBox.textContent = resp.data?.message || 'E-mail ou senha inválidos.';
    errBox.style.display = 'block';
    return;
  }
  localStorage.setItem('vst_session', resp.data.token);
  usuarioLogado = resp.data.user.email;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  render('dashboard');
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  if(supaOk) await apiFetch('/api/logout', { method:'POST' });
  localStorage.removeItem('vst_session');
  usuarioLogado = null;
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-senha').value = '';
});

window.addEventListener('error', function(e){
  console.error('Erro capturado:', e.error || e.message);
});

initAuth();
